[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-eeg-electrode-reduction"
version = "1.0.0"
description = "Classifier-dependent effects of electrode reduction in motor-imagery EEG decoding: analysis code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "moabb==1.7.2",
  "mne==1.13.2",
  "pyriemann==0.12",
  "scikit-learn==1.9.1",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pandas==3.0.6",
]

[tool.setuptools.packages.find]
where = ["code/src"]
